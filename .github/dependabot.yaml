# Dependabot version updates. Read from and opened against the default
# branch (main); the ci workflow lints, tests and builds them there, and
# merging one releases it like any other change. Sync dev with main after
# merging one.
#
# Also turn on "Dependabot alerts" and "Dependabot security updates" in the
# repo settings (Advanced Security): when a dependency gets a vulnerability
# with a fix, a PR opens right away, without the cooldown below.
version: 2
updates:
  # The app's libraries and Gradle plugins (build.gradle.kts files) and the
  # Gradle wrapper. New releases wait a week before they're proposed, so a
  # compromised one is usually pulled before it reaches this repo. Security
  # fixes don't wait: they come from the security updates above.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # The Kotlin version appears twice (the buildscript classpath and the
      # Compose compiler plugin) and both must match: one PR for both.
      kotlin:
        patterns: ["org.jetbrains.kotlin*"]
      # Media3's modules (exoplayer, hls, ui) only work at the same version.
      media3:
        patterns: ["androidx.media3:*"]
      # Everything else, minor and patch updates together. Major updates
      # (e.g. the Android Gradle Plugin or OkHttp) get a PR each.
      gradle-minor-patch:
        update-types: [minor, patch]

  # Workflow actions are pinned to commits; this updates the commit and the
  # version comment next to it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
