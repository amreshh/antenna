name: ci

# Like amreshh/wirepulse: a pull request builds and checks everything, and
# merging it releases exactly what it built and tested.
#
#   pull request   unit tests (and their code coverage), Android lint, the workflow checks (actionlint,
#                  zizmor) and the dependency scan (known vulnerabilities, from
#                  osv.dev) side by side, and the release APK: built with R8 and
#                  the version merging would release, its security settings
#                  checked, then started on an emulator (smoke test, with cold
#                  start and memory budgets). A comment on the pull request sums
#                  it up: each check, their tables, and a link to download the APK.
#                  A pull request that changes only the docs gets the workflow
#                  checks alone: merging it releases nothing.
#   push to main   the release, with no checks and no build: the APK the merged
#                  pull request built and tested, signed with the release key, a
#                  git tag v1.2.3 and a GitHub Release with generated notes. The
#                  APK is built here (and smoke-tested) only when there's no
#                  tested one: the pull request came from a fork, wasn't up to
#                  date with main, or its run failed or its APK expired (after
#                  30 days).
#   push to dev    nothing: work in progress is checked by its pull request
#   tag v1.2.3     every check, then that version built and released (manual;
#                  the tag must be on main). A tag like v1.2.3-rc1 is a
#                  pre-release.
#
#   plan ─┬─ test ─────────┐
#         ├─ lint ─────────┤
#         ├─ deps ─────────┤
#         ├─ build ─ smoke ┼─ checks ─┬─ report (pull requests)
#         └─ cache (main)  │          └─ sign ─ release (main, tags)
#   workflows ─────────────┘
#
# smoke also waits for test, lint, deps and workflows, and doesn't start when
# one failed: nothing that failed can be merged, and the emulator is the slowest
# part. (They finish before build does, so it starts no later.)
#
# Version: merging into main bumps the patch of the latest vX.Y.Z tag; "#minor"
# or "#major" in the pull request's title or in a commit message bumps that
# instead. The pull request works it out and builds it into the APK, and its
# comment says which version merging releases; when main builds the APK
# itself, it reads the merged pull request's title too. (With no tags yet, the
# first release is versionName in app/build.gradle.kts.) Changes to nothing but
# the docs (Markdown files and docs/) release nothing.
#
# Which APK main releases: every file but the docs is fingerprinted, and a pull
# request keeps its APK as the apk-<fingerprint> artifact. main takes it from
# the merged pull request's last successful run when the fingerprint matches
# main's, so main releases exactly the code that was tested. Requiring pull
# requests to be up to date before merging (a branch rule) makes that always so.
#
# Signing: Gradle signs the APK with a throwaway debug key, and the sign job,
# which builds nothing, signs it again with the release key. The key comes from
# these secrets, best kept in the "release" environment and limited to main and
# v* tags (see "Releases" in the README):
#   ANDROID_KEYSTORE_BASE64     the keystore file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# A release without them fails rather than ship an APK signed with a throwaway key.
#
# Caches: only the cache job saves Gradle's cache, on main after a merge. It runs
# everything pull requests run, so its entry has all they need; every other job
# (here, CodeQL's and the weekly dependency scan) only restores it, so nothing a
# pull request does reaches it.
on:
  push:
    # main only: a merged pull request, to release. Pushes to dev are work in
    # progress; their pull request runs the checks.
    branches: [main]
    # Version-shaped tags only, so a stray tag like "vtest" never triggers a release.
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release halfway (tag created but no APK attached yet).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

# No token permissions unless a job asks for them.
permissions: {}

env:
  # The docs, as git pathspecs separated by spaces: everything else is the code
  # the fingerprint covers.
  DOCS: ":(exclude)*.md :(exclude)docs/"

jobs:
  # Fingerprints the code, works out the version, and on main finds the APK the
  # merged pull request tested.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # main: the merged pull request's run and its APK
      pull-requests: read # main: which pull request was merged
    outputs:
      code: ${{ steps.code.outputs.code }}
      code-changed: ${{ steps.code.outputs.changed }}
      version: ${{ steps.tested.outputs.version || steps.version.outputs.version }}
      previous: ${{ steps.version.outputs.previous }}
      release: ${{ steps.version.outputs.release }}
      build: ${{ steps.tested.outputs.build }}
      tested-run: ${{ steps.tested.outputs.run }}
    steps:
      # Pull requests: GitHub's test merge of the pull request into its base,
      # which is what main will have once it's merged.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the release tags, and the pull request's commits
          persist-credentials: false

      # A pull request that changes only the docs skips the jobs that build and
      # check the app (tests, lint, the dependency scan, the APK and its smoke
      # test): there's nothing new for them to check, and merging it releases
      # nothing. checks counts a skipped job as passed.
      - name: Fingerprint the code
        id: code
        run: |
          read -ra docs <<< "$DOCS"
          code=$(git ls-files -s -- . "${docs[@]}" | sha256sum | cut -c1-20)
          echo "Code fingerprint: $code"
          changed=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git diff --quiet HEAD^1 HEAD -- . "${docs[@]}"; then
            echo "Only the docs change: no tests, lint, dependency scan or APK"
            changed=false
          fi
          {
            echo "code=$code"
            echo "changed=$changed"
          } >> "$GITHUB_OUTPUT"

      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          stable='^v[0-9]+\.[0-9]+\.[0-9]+$'
          last=$(git tag -l 'v*' --sort=-v:refname | grep -E "$stable" | head -1 || true)

          # The version after the last release, bumped as the text says (#minor, #major).
          next() { # <text>
            if [ -z "$last" ]; then
              grep -oP '"antennaVersion"\) as String\?\) \?: "\K[0-9]+\.[0-9]+\.[0-9]+' app/build.gradle.kts
              return
            fi
            local major minor patch
            IFS=. read -r major minor patch <<< "${last#v}"
            if grep -q '#major' <<< "$1"; then
              echo "$((major + 1)).0.0"
            elif grep -q '#minor' <<< "$1"; then
              echo "$major.$((minor + 1)).0"
            else
              echo "$major.$minor.$((patch + 1))"
            fi
          }

          release=false
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            pull_request:*)
              # Its title and commits (HEAD is the test merge: its base, then its head).
              version=$(next "$(printf '%s\n' "$PR_TITLE"; git log --format=%B HEAD^1..HEAD^2)")
              ;;
            push:refs/tags/v*)
              # Releases come from main only. Checked here, before any other job
              # starts, rather than in build.
              if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                echo "::error::Tag ${GITHUB_REF_NAME} points at a commit that is not on main"
                exit 1
              fi
              version=${GITHUB_REF_NAME#v}
              # The notes start at the stable release before this one.
              last=$(git tag -l 'v*' --sort=-v:refname | grep -E "$stable" | grep -vxF "$GITHUB_REF_NAME" |
                while read -r t; do git merge-base --is-ancestor "$t" HEAD && echo "$t"; done | head -1 || true)
              release=true
              ;;
            push:refs/heads/main)
              read -ra docs <<< "$DOCS"
              if git tag --points-at HEAD | grep -E "$stable" > /dev/null; then
                echo "HEAD is already released, nothing to do"
              elif [ -n "$last" ] && git diff --quiet "$last" HEAD -- . "${docs[@]}"; then
                echo "Only the docs changed since $last, nothing to release"
              else
                release=true
              fi
              # The merged pull request's title as well as the commit messages, as
              # its own run had it: a "#minor" only in the title is in no commit
              # after a rebase merge, or when the squash commit's message leaves it
              # out (v0.6.0's does). It matters when main builds the APK itself.
              title=""
              if [ "$release" = true ]; then
                title=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
                  --jq 'first(.[] | select(.merged_at != null and .base.ref == "main")) | .title')
              fi
              version=$(next "$(printf '%s\n' "$title"; git log --format=%B "${last:+$last..}HEAD")")
              ;;
            *)
              # manual runs: an APK to try out
              version=$(next "")
              ;;
          esac

          echo "Version: $version (previous release: ${last:-none}, releasing: $release)"
          {
            echo "version=$version"
            echo "previous=$last"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

      # main: no build when the merged pull request's run built and tested this
      # exact code. Otherwise (and on every other event) the build job builds it.
      - name: Find the APK the pull request tested
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.code.outputs.code }}
          CHANGED: ${{ steps.code.outputs.changed }}
          RELEASE: ${{ steps.version.outputs.release }}
          LAST: ${{ steps.version.outputs.previous }}
        run: |
          build() { # <why>
            echo "$1"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ "$CHANGED" != true ]; then
            echo "Only the docs change: no APK to build"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" != push ] || [ "$GITHUB_REF" != refs/heads/main ]; then
            build "This run builds its own APK"
          fi
          if [ "$RELEASE" != true ]; then
            echo "Nothing to release"
            exit 0
          fi

          # The pull request merged into this commit (by squash, merge or rebase),
          # if it came from this repository rather than a fork...
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" |
            jq -r --arg repo "$GITHUB_REPOSITORY" 'first(.[] | select(.merged_at != null and .base.ref == "main"
              and .head.repo.full_name == $repo)) | "\(.number) \(.head.sha)"')
          if [ -z "$pr" ]; then
            build "No pull request from this repository was merged into ${GITHUB_SHA:0:7}: building the APK"
          fi
          read -r number head <<< "$pr"

          # ...its last successful run, for its last commit...
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yaml/runs?event=pull_request&status=success&head_sha=$head&per_page=1" \
            --jq '.workflow_runs[0].id // empty')
          if [ -z "$run" ]; then
            build "Pull request #$number has no successful run for its last commit: building the APK"
          fi

          # ...and that run's APK, if it's of this code.
          if ! gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "apk-$CODE" --dir "$RUNNER_TEMP/tested"; then
            build "Pull request #$number's run $run has no APK of this code (it wasn't up to date with main, or its APK expired): building the APK"
          fi
          apk=$(find "$RUNNER_TEMP/tested" -name '*.apk' -print -quit)
          aapt2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          tested=$("$aapt2" dump badging "$apk" | sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p")

          # Its version has to be one this release can have: not released yet, and newer.
          newer=true
          if [ -n "$LAST" ]; then
            if [ "$tested" = "${LAST#v}" ] || [ "$(printf '%s\n%s\n' "${LAST#v}" "$tested" | sort -V | tail -1)" != "$tested" ]; then
              newer=false
            fi
          fi
          if ! [[ "$tested" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || git rev-parse -q --verify "refs/tags/v$tested" > /dev/null ||
            [ "$newer" != true ]; then
            build "Pull request #$number's APK is version ${tested:-?}, which can't follow ${LAST:-nothing}: building the APK"
          fi

          echo "Releasing the APK pull request #$number tested in run $run: version $tested"
          {
            echo "build=false"
            echo "run=$run"
            echo "version=$tested"
          } >> "$GITHUB_OUTPUT"

  # Everything but pushes to main (whose pull request ran the tests).
  test:
    needs: plan
    if: (github.event_name != 'push' || github.ref != 'refs/heads/main') && needs.plan.outputs.code-changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pull requests: the test merge and its parents, the first being the base
          # branch, for the code coverage's comparison.
          fetch-depth: 2
          persist-credentials: false

      # The JDK that runs Gradle: the version gradle/gradle-daemon-jvm.properties
      # asks for, so Gradle doesn't download one of its own. (The app itself
      # targets Java 17.)
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25

      # Gradle's downloads, restored from main's cache, and a check that
      # gradle/wrapper/gradle-wrapper.jar is a genuine Gradle release. zizmor's
      # cache-poisoning warning doesn't apply: only the cache job saves this
      # cache, on main, so nothing from a pull request reaches anything that's
      # released.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # zizmor: ignore[cache-poisoning] v6.4.1

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Test results
        if: ${{ !cancelled() }}
        run: |
          python3 -I .github/scripts/test-summary.py app/build/test-results > "$RUNNER_TEMP/tests-summary.md"
          cat "$RUNNER_TEMP/tests-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-summary-tests
          path: ${{ runner.temp }}/tests-summary.md
          if-no-files-found: ignore
          retention-days: 7

      # How much of the code the tests run (JaCoCo, enabled in app/build.gradle.kts):
      # a table in the run summary and the pull request comment, and the whole report,
      # down to each line, as the coverage-report artifact. Only when the tests passed.
      # Pull requests also measure the base branch's code (the test merge's first
      # parent, in a worktree beside this one) to say whether the coverage went up or
      # down, and how much of what the pull request adds or changes the tests run.
      - name: Code coverage
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          ./gradlew createDebugUnitTestCoverageReport
          report=app/build/reports/coverage/test/debug/report.xml
          args=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base="$RUNNER_TEMP/base"
            git worktree add --detach "$base" HEAD^1
            if (cd "$base" && ./gradlew --quiet createDebugUnitTestCoverageReport); then
              args+=(--base "$base/$report")
            else
              echo "::notice::No coverage of $BASE_REF to compare with: it doesn't measure it yet, or its tests failed"
            fi
            git diff --unified=0 --no-color --find-renames HEAD^1 HEAD -- app/src/main/java > "$RUNNER_TEMP/changes.diff"
            args+=(--base-name "$BASE_REF" --diff "$RUNNER_TEMP/changes.diff")
          fi
          python3 -I .github/scripts/coverage-summary.py "$report" "${args[@]}" > "$RUNNER_TEMP/coverage-summary.md"
          cat "$RUNNER_TEMP/coverage-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-summary-coverage
          path: ${{ runner.temp }}/coverage-summary.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: app/build/reports/coverage/test/debug/
          if-no-files-found: ignore
          retention-days: 7

  # Android lint: pull requests, tags and manual runs. Its findings are a table
  # in the run summary and the pull request comment; errors fail it.
  lint:
    needs: plan
    if: (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')) && needs.plan.outputs.code-changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25

      # Restores main's cache only; see the test job.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # zizmor: ignore[cache-poisoning] v6.4.1

      - name: Android lint
        run: ./gradlew lintDebug

      # Not when lint stopped before writing its report: the failed step says why.
      - name: Lint table
        if: ${{ !cancelled() && hashFiles('app/build/reports/lint-results-debug.sarif') != '' }}
        uses: $/.github/actions/sarif-summary
        with:
          sarif: app/build/reports/lint-results-debug.sarif
          name: lint
          title: Android lint

      - name: Lint report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

  # The workflow files: pull requests, tags and manual runs.
  #   actionlint  syntax, expressions, and ShellCheck on the run: scripts
  #   zizmor      security problems (injection, credentials, cache poisoning…):
  #               fails on any finding, which are also a table in the run
  #               summary and the pull request comment, and in code scanning
  # It needs nothing from plan, so it starts straight away.
  workflows:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # zizmor's report, in code scanning
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      # Pull requests: the head commit, so code scanning files zizmor's report
      # under it. (Empty on other events: the default.)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: actionlint
        run: |
          file="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${file}"
          echo "${ACTIONLINT_SHA256}  ${file}" | sha256sum -c -
          tar -xzf "$file" actionlint
          ./actionlint -color

      # SARIF, for the table, also uploaded to code scanning. zizmor never fails
      # in this mode, so the last step does the checking. (Pull requests from
      # forks get a read-only token: no upload, no table.)
      - name: zizmor report
        id: report
        if: ${{ !cancelled() && !github.event.pull_request.head.repo.fork }}
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0

      - name: zizmor table
        if: ${{ !cancelled() && steps.report.outputs.output-file != '' }}
        uses: $/.github/actions/sarif-summary
        with:
          sarif: ${{ steps.report.outputs.output-file }}
          name: zizmor
          title: Workflow security (zizmor)

      # Fails on findings and marks them on the workflow lines.
      - name: zizmor
        if: ${{ !cancelled() }}
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          advanced-security: false
          annotations: true

  # Known vulnerabilities in the libraries the release APK is built from
  # (.github/scripts/osv-deps.py, against osv.dev): pull requests, tags and
  # manual runs. A table in the run summary and the pull request comment; any
  # finding fails it, unless .github/osv-ignore.txt says why it doesn't apply.
  # (dependency-scan.yaml also runs it on main every week.)
  deps:
    needs: plan
    if: (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')) && needs.plan.outputs.code-changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25

      # Restores main's cache only; see the test job.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # zizmor: ignore[cache-poisoning] v6.4.1

      - name: The release APK's libraries
        run: ./gradlew -q :app:dependencies --configuration releaseRuntimeClasspath > "$RUNNER_TEMP/deps.txt"

      - name: Known vulnerabilities
        run: |
          status=0
          python3 -I .github/scripts/osv-deps.py "$RUNNER_TEMP/deps.txt" > "$RUNNER_TEMP/deps-summary.md" || status=$?
          cat "$RUNNER_TEMP/deps-summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-summary-deps
          path: ${{ runner.temp }}/deps-summary.md
          if-no-files-found: ignore
          retention-days: 7

  # The release APK, with R8 and the version from plan. Not on main when the
  # merged pull request's APK is released (then nothing is built), nor for a
  # pull request that changes only the docs.
  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      apk-url: ${{ steps.keep.outputs.artifact-url }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      # Its commit only: plan checked that a release tag is on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25

      # Restores main's cache only; see the test job. Read-only on main too: an
      # entry of its own would be what later pull requests' build jobs restore
      # (setup-gradle prefers the same job's), and it lacks what the tests and
      # lint need, then goes stale.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # zizmor: ignore[cache-poisoning] v6.4.1
        with:
          cache-read-only: true

      # Signed with Gradle's throwaway debug key: installable to try out, and
      # signed with the release key when it's released (the sign job).
      - name: Release APK
        run: |
          ./gradlew assembleRelease -PantennaVersion="$VERSION"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/antenna-v$VERSION.apk"

      - name: APK summary
        run: |
          apk="dist/antenna-v$VERSION.apk"
          aapt2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          badging=$("$aapt2" dump badging "$apk")
          code=$(sed -n "s/^package: .*versionCode='\([0-9]*\)'.*/\1/p" <<< "$badging")
          min=$(sed -n "s/^minSdkVersion:'\([0-9]*\)'$/\1/p" <<< "$badging")
          target=$(sed -n "s/^targetSdkVersion:'\([0-9]*\)'$/\1/p" <<< "$badging")
          size=$(awk -v b="$(stat -c %s "$apk")" 'BEGIN { printf "%.1f", b / 1e6 }')
          {
            echo "## Release APK"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Version | $VERSION (versionCode $code) |"
            echo "| Size | $size MB, shrunk with R8 |"
            echo "| Android | API $min and up, targets API $target |"
            echo "| Signed with | a throwaway test key; the release key replaces it when it's released |"
          } > "$RUNNER_TEMP/apk-summary.md"
          cat "$RUNNER_TEMP/apk-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-summary-apk
          path: ${{ runner.temp }}/apk-summary.md
          retention-days: 7

      # Not debuggable, HTTPS only, kept out of cloud backups, only the expected
      # exported components and permissions, signature scheme v2+, under the
      # size budget (.github/scripts/apk-security.py). Fails before the APK is
      # kept, so an APK that fails it is never released.
      - name: APK security checks
        run: |
          status=0
          python3 -I .github/scripts/apk-security.py "dist/antenna-v$VERSION.apk" > "$RUNNER_TEMP/apk-security-summary.md" || status=$?
          cat "$RUNNER_TEMP/apk-security-summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-summary-apk-security
          path: ${{ runner.temp }}/apk-security-summary.md
          if-no-files-found: ignore
          retention-days: 7

      # Named after the code it's built from, so main can find it once this is
      # merged. Pull requests keep it 30 days, the most this repository allows
      # (Settings → Actions → General → Artifact and log retention; asking for
      # more only gets a warning): merged later, main builds its own.
      - name: Keep the APK
        id: keep
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-${{ needs.plan.outputs.code }}
          path: dist/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 30 || 7 }}
          overwrite: true # a re-run replaces it

  # The APK on an emulator (.github/scripts/smoke-test.sh): it installs and
  # starts, the home screen shows, the player loads a video and minimizes,
  # search finds videos and opens a channel, nothing crashes; and cold start and
  # memory stay within their budgets.
  # Everywhere the APK is built, unless another check failed (see the top).
  smoke:
    needs: [plan, build, test, lint, workflows, deps]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-${{ needs.plan.outputs.code }}
          path: apk

      # The runner's KVM, so the emulator runs at full speed.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          APK: apk/antenna-v${{ needs.plan.outputs.version }}.apk
          SUMMARY: ${{ runner.temp }}/smoke-summary.md
          SCREENSHOTS: ${{ runner.temp }}/smoke-screenshots
        with:
          api-level: 35 # Android 15, which many phones run (the app targets 36, see app/build.gradle.kts)
          target: google_apis
          arch: x86_64
          cores: 4
          disable-spellchecker: true
          script: bash .github/scripts/smoke-test.sh

      - name: Smoke test summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f "$RUNNER_TEMP/smoke-summary.md" ]; then
            cat "$RUNNER_TEMP/smoke-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-summary-smoke
          path: ${{ runner.temp }}/smoke-summary.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-screenshots
          path: ${{ runner.temp }}/smoke-screenshots
          if-no-files-found: ignore
          retention-days: 7

  # main, after a merge: everything pull requests run, to save Gradle's
  # downloads for them. It's the only job that saves Gradle's cache: before it,
  # the cache was CodeQL's, which only compiles, so each pull request downloaded
  # what the tests and lint need from Maven Central (which sometimes answers
  # 429 Too Many Requests), and build restored a stale entry of its own. Not a
  # check: if it fails, the release still goes out and pull requests download
  # what's missing.
  cache:
    needs: plan
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25

      # Saves the cache at the end (setup-gradle's default on main). From main's
      # own code only; see the test job.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # zizmor: ignore[cache-poisoning] v6.4.1

      # What test, lint, deps and build run. --continue: a failure doesn't stop
      # the rest from downloading what it needs.
      - name: Everything pull requests run
        run: |
          ./gradlew --continue testDebugUnitTest createDebugUnitTestCoverageReport lintDebug assembleRelease
          ./gradlew -q :app:dependencies --configuration releaseRuntimeClasspath > /dev/null

  # The one check to require in branch rules: fails when any check failed or
  # was cancelled. (A skipped job counts as passed, so requiring build alone
  # would let a failed lint through.)
  checks:
    needs: [plan, test, lint, workflows, deps, build, smoke]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All checks passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "plan, test, lint, workflows, deps, build, smoke: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac

  # Pull requests: one comment with the results and the tables
  # (.github/scripts/ci-report.sh), updated on every run. (Pull requests from
  # forks get a read-only token: no comment.)
  report:
    needs: [plan, test, lint, workflows, deps, build, smoke]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # the script
      pull-requests: write # the comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tables: tests, code coverage, lint, zizmor, dependencies, APK, APK
      # security, smoke test. One is missing when its job didn't get that far.
      - name: Get the tables
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scan-summary-*
          path: tables
          merge-multiple: true

      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.ref }}
          VERSION: ${{ needs.plan.outputs.version }}
          CHANGED: ${{ needs.plan.outputs.code-changed }}
          TEST: ${{ needs.test.result }}
          LINT: ${{ needs.lint.result }}
          WORKFLOWS: ${{ needs.workflows.result }}
          DEPS: ${{ needs.deps.result }}
          BUILD: ${{ needs.build.result }}
          SMOKE: ${{ needs.smoke.result }}
          APK_URL: ${{ needs.build.outputs.apk-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p tables
          (cd tables && "$GITHUB_WORKSPACE/.github/scripts/ci-report.sh") > comment.md
          marker=$(head -1 comment.md)

          # Update the earlier comment if there is one, so the PR keeps one.
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | tail -n 1)
          if [ -n "$id" ]; then
            jq -n --rawfile body comment.md '{body: $body}' |
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" --input - > /dev/null
          else
            jq -n --rawfile body comment.md '{body: $body}' |
              gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --input - > /dev/null
          fi

  # main and tags: the APK signed with the release key. The only job with the
  # key, and it builds nothing: it signs the APK the pull request (or, without
  # one, this run's build job) built and tested. It runs in the "release"
  # environment, so the secrets can be kept there and limited to main and v*
  # tags (Settings → Environments; see the README). Repository secrets work too.
  sign:
    needs: [plan, checks]
    if: ${{ !cancelled() && needs.plan.outputs.release == 'true' && needs.checks.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      actions: read # the APK from the pull request's run
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: The APK the pull request tested
        if: needs.plan.outputs.tested-run != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-${{ needs.plan.outputs.code }}
          path: apk
          run-id: ${{ needs.plan.outputs.tested-run }}
          github-token: ${{ github.token }}

      - name: The APK this run built and tested
        if: needs.plan.outputs.tested-run == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-${{ needs.plan.outputs.code }}
          path: apk

      - name: Check it's this app and version
        run: |
          aapt2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          package=$("$aapt2" dump badging "apk/antenna-v$VERSION.apk" | sed -n '/^package:/p')
          echo "$package"
          if ! grep -q "name='com.example.antenna' .* versionName='$VERSION'" <<< "$package"; then
            echo "::error::The APK isn't com.example.antenna $VERSION"
            exit 1
          fi

      # The keystore only exists on the runner for this step, and the passwords
      # reach apksigner through the environment, not its command line.
      - name: Sign with the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::The release signing secrets aren't set (see the top of .github/workflows/ci.yaml)"
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$keystore"' EXIT
          base64 -d <<< "$KEYSTORE_BASE64" > "$keystore"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          mkdir -p dist
          # No v4 signature: it's only for streamed installs (adb install
          # --incremental), and apksigner would write it as an extra .idsig file
          # that ends up in the release. Android checks the v2/v3 signatures.
          "$apksigner" sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --v4-signing-enabled false \
            --out "dist/antenna-v$VERSION.apk" "apk/antenna-v$VERSION.apk"

      # Fails if the APK isn't signed with the release key. Prints the
      # certificate, to compare with an installed copy.
      - name: Check the signature
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          apk="dist/antenna-v$VERSION.apk"
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          if grep -q 'CN=Android Debug' "$RUNNER_TEMP/certs.txt"; then
            echo "::error::The release APK is signed with a debug key"
            exit 1
          fi
          (cd dist && sha256sum "antenna-v$VERSION.apk" > "antenna-v$VERSION.apk.sha256")

      - name: Upload release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Publishes what the sign job signed: the tag, the GitHub Release and its
  # notes. Builds nothing, so the one job with write access runs no build code.
  release:
    needs: [plan, sign]
    if: ${{ !cancelled() && needs.sign.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the tag and the release
      pull-requests: read # the merged pull requests' commits, for the notes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the commits since the previous release
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      # The commits of the pull requests merged since the previous release,
      # by area (.github/scripts/release-notes.sh), above GitHub's generated
      # notes, which list only the pull requests. Without them (first
      # release, or the script failed) the release still goes out.
      - name: Release notes
        if: needs.plan.outputs.previous != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ needs.plan.outputs.previous }}
        run: |
          .github/scripts/release-notes.sh "$PREVIOUS" "$GITHUB_SHA" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      # Tags created with GITHUB_TOKEN don't trigger workflows, so this won't
      # run again for the tag. A pushed tag already exists: the release uses it.
      - name: Tag and create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v${{ needs.plan.outputs.version }}
          PREVIOUS: ${{ needs.plan.outputs.previous }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes)
          if [ -n "$PREVIOUS" ]; then
            args+=(--notes-start-tag "$PREVIOUS")
          fi
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            args+=(--notes-file "$RUNNER_TEMP/notes.md")
          fi
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$VERSION" "${args[@]}" dist/*
