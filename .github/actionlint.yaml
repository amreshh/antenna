# actionlint settings: https://github.com/rhysd/actionlint/blob/main/docs/config.md
paths:
  .github/workflows/*.yaml:
    ignore:
      # GitHub's self-repository syntax for actions in this repo (uses: $/...),
      # which zizmor asks for, is newer than actionlint 1.7.12. Remove once
      # actionlint understands it. (Same as in amreshh/wirepulse.)
      - 'specifying action "\$/\.github/actions/[a-z-]+" in invalid format'
